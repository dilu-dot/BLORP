name: Publish Blorp AI Windows preview

on:
  workflow_run:
    workflows:
      - Build public Blorp AI Windows app
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish customer preview to GitHub Releases
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Windows executable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh run download "$BUILD_RUN_ID" --repo "$REPOSITORY" --name Blorp-AI-Windows-Preview --dir ./download
          test -n "$(find ./download -type f -name '*.exe' -print -quit)"

      - name: Publish public preview release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG="desktop-v0.5.6-cloud-preview"
          EXE="$(find ./download -type f -name '*.exe' -print -quit)"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" "$EXE" --repo "$REPOSITORY" --target "$SOURCE_SHA" --title "Blorp AI for Windows — Supabase cloud membership preview" --prerelease --notes "Supabase email sign-in and membership status are connected in this cloud preview. Google OAuth requires provider configuration in Supabase and the desktop loopback callback allowlist. AI builds and payments are not enabled. This is not a production SaaS service. Without a compatible running backend it opens the Blorp demo; sign-in, payments, cloud sync, AI responses and builds do not work offline. Do not expose the local development backend to the internet. The private Blorp Owner app is NOT included."
          fi
