name: Blorp local foundation tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q server.py provider_discovery.py provider_vault.py payment_checkout.py local_runtime.py build_frontend.py patch_frontend.py manage_owner.py
      - name: Local account and API tests
        run: python tests/test_api.py
      - name: Mock Ollama agent tests
        run: python tests/test_local_agents.py
      - name: Membership, owner and payment API tests
        run: python tests/test_memberships.py
      - name: Timed checkout invariants
        run: python tests/test_payment_checkout.py
      - name: Provider key vault tests
        run: python tests/test_provider_vault.py
      - name: Mock provider model discovery and authentication tests
        run: python tests/test_provider_discovery.py
      - name: Studio browser authentication and responsive profile
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/test_studio_browser.py
      - name: Premium Studio inline JavaScript syntax
        run: node tests/check_studio_inline.js
      - name: Frontend JavaScript syntax
        run: |
          node --check public/assets/base.js
          node --check public/assets/v5.js
          node --check public/assets/v51.js
          node --check public/assets/v52.js
          node --check public/assets/v53.js
          node --check public/assets/studio-backend-bridge.js
          node --check public/assets/studio-provider-keys.js

  supabase-cloud-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Blorp membership backend contract
        run: python tests/test_cloud_backend.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Function TypeScript
        run: |
          cd supabase/functions/blorp-membership && deno check index.ts
          cd ../blorp-ai && deno check index.ts
