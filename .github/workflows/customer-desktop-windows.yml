name: Build public Blorp AI Windows app

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'desktop/**'
      - 'public/**'
      - '.github/workflows/customer-desktop-windows.yml'
      - '.github/workflows/publish-customer-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    name: Build customer Windows EXE
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build application icon
        run: python desktop/generate_icon.py
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Verify desktop source
        run: npm run desktop:check
      - name: Package Windows desktop app
        run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload public preview EXE
        uses: actions/upload-artifact@v4
        with:
          name: Blorp-AI-Windows-Preview
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 90
